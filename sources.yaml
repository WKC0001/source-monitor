# ============================================================
# 源候选池 · 双池结构
#   pools.active : 现役池 —— 进入 output/api.json，对播放器生效
#   pools.bench  : 候补池 —— 每日同样检测，现役死亡时按分数自动顶上
# 状态机（由 checker/check.py 自动维护，无需手改）：
#   active --连续失败>=demote_fail--> bench --连续失败>=dead_fail--> 移入 output/history/attic
#   bench  --连续成功>=promote_ok--> active（现役有空缺时）
# ============================================================

epg: "https://ep.112114.xyz"

# ---- 品牌与引流（写入 api.json，零改包，FongMi 原生支持）----
brand:
  # 每次打开 App / 刷新配置时底部短暂显示（FongMi: Notify.show(config.getNotice())）
  notice: "本源由 WKC0001 每日 07:00 自动更新维护"
  # 全部源失效时，App 加载配置会弹出此消息引导用户（FongMi: checkJson 对 msg 字段直接抛出显示）
  failover_msg: "所有源已失效！请关注公众号【待填写】回复「源」获取最新地址"
  # 壁纸图片 URL（留空则沿用模板源自带的壁纸，如王二小的 loliapi 随机动漫壁纸）
  wallpaper: ""

# ---- 模板跟随（照抄可用家源的完整设计）----
# 家源能用的关键不是 sites 列表本身，而是 sites + spider jar + parses(解析接口) +
# rules(嗅探) + ads(广告屏蔽) + doh(加密DNS) + headers 是一套严格配套的自洽整体。
# 拼装别人的 sites 会因 jar 里没有对应 csp 类而全站报错。因此按序取第一个存活的
# 模板源整包透传，仅替换品牌字段；全部失效才回退到下方聚合渲染。
template:
  - { name: 王二小模板, url: "http://new.xn--4kq62z5rby2qupq9ub.top" }


name: daily-source-check

on:
  schedule:
    - cron: "0 23 * * *"        # UTC 23:00 = 北京 07:00
  workflow_dispatch:             # 手动触发按钮

permissions:
  contents: write

concurrency:
  group: source-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Run checker
        run: python checker/check.py --config sources.yaml --state state.json --out output

      - name: Build 饭太硬-standard config (clean jar + upstream sites)
        run: python checker/fty_build.py --out output

      - name: Build extras (bg.jpg + dc.json)
        run: python checker/dist_extras.py --out output

      - name: Publish to npm (npmmirror 国内主通道)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir -p npmstage
          cp output/api.json output/bg.jpg output/dc.json output/cfg.jpg npmstage/
          cd npmstage
          cat > package.json <<EOF
          {
            "name": "wkc0001-tvbox",
            "version": "0.1.${{ github.run_number }}",
            "description": "tv config snapshot",
            "files": ["api.json", "bg.jpg", "dc.json", "cfg.jpg"],
            "publishConfig": { "access": "public" }
          }
          EOF
          npm publish --registry https://registry.npmjs.org/ || echo "publish failed (non-fatal)"

      - name: Auto commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(check): daily source check ${{ github.run_id }}"

      - name: Purge jsDelivr cache
        run: |
          sleep 10
          for f in api.json bg.jpg dc.json cfg.jpg; do
            curl -sf --max-time 30 "https://purge.jsdelivr.net/gh/WKC0001/source-monitor@main/output/$f" > /dev/null && echo "purged gh/$f" || echo "purge gh/$f failed (non-fatal)"
          done
          curl -sf --max-time 30 "https://purge.jsdelivr.net/npm/wkc0001-tvbox@latest/api.json" > /dev/null && echo "purged npm/api.json" || echo "purge npm failed (non-fatal)"
          curl -sf --max-time 30 "https://purge.jsdelivr.net/npm/wkc0001-tvbox@latest/cfg.jpg" > /dev/null && echo "purged npm/cfg.jpg" || echo "purge npm/cfg.jpg failed (non-fatal)"
